<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Practice Lab</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .exercise-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; padding:0; list-style:none; }
    .exercise-list a { display:block; padding:1rem; background:white; border:1px solid var(--line); text-decoration:none; }
    .exercise-list a:hover { border-color:var(--accent); transform:translateY(-2px); }
  </style>
</head>
<body>
  <header class="portfolio-hero"><a href="../index.html">Back to main lab</a><h1>CSS Practice Lab</h1><p>75 CSS exercises.</p></header>
  <main><h2>Exercises</h2><ul class="exercise-list" id="exercises"></ul></main>
  <script>
    const files = [
      '01-css-sources','02-selectors','03-colors-backgrounds-borders','04-fonts-text','05-box-model','06-sizing','07-positioning','08-float-clear','09-navigation','10-pseudo-classes','11-pseudo-elements','12-lists-tables','13-registration-form','14-flexbox','15-grid','16-media-queries','17-transitions-transformations','18-animations','19-responsive-navigation','20-portfolio','21-student-profile','22-login','23-product-card','24-photo-gallery','25-homepage','26-inheritance-specificity','27-selector-types','28-combinators','29-css-variables','30-background-images','31-gradients','32-shadows','33-border-radius','34-opacity','35-overflow','36-z-index','37-display','38-visibility','39-dropdown','40-image-hover','41-tooltip','42-button-animation','43-filters','44-object-fit','45-responsive-gallery','46-flex-cards','47-dashboard-grid','48-two-column-grid','49-three-column-flex','50-sticky-header','51-fixed-sidebar','52-responsive-footer','53-responsive-auth','54-contact-form','55-college-homepage','56-restaurant','57-shopping','58-travel','59-news-grid','60-multi-section-portfolio','61-grid-template-areas','62-flex-alignment','63-grid-media-query','64-mobile-first','65-transitions','66-transformations','67-keyframes','68-spinner','69-sliding-card','70-modal','71-dark-mode','72-responsive-typography','73-min-max-clamp','74-calc','75-complete-responsive-site'
    ];
    document.querySelector('#exercises').innerHTML = files.map(file => `<li><a href="${file}.html">${file.replaceAll('-', ' ')}</a></li>`).join('');
  </script>
</body>
</html>
